services:
  backfill-lab:
    build: .
    container_name: cc-backfill-lab-backfill-bug-14
    ports:
      - "8180:7200"
    environment:
      HOST: "0.0.0.0"
      PORT: "7200"
      DATABASE_PATH: /app/instance/backfill_lab.db
    volumes:
      - backfill_lab_data:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7200/login', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  backfill_lab_data:
